<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#153b49"><title>TOP · Field Pocket</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="mobile.css"></head><body>
<header><div><small>TOP · FIELD OPERATIONS</small><h1>Field Pocket</h1></div><span id="connection" class="badge"></span></header>
<main><section class="sync"><strong>Offline field library</strong><p id="saved">No downloaded data yet.</p><p class="muted">Personal device only. Downloaded project records remain on this device until you remove them. Photos and PDF drawings are not included in this preview.</p><div class="actions"><button id="download">Sign in & download</button><button id="remove" class="secondary" hidden>Remove local data</button></div><p id="message" role="status" aria-live="polite"></p><small id="install">Mobile preview 0.1 · Read only</small></section>
<nav aria-label="Data type"><button data-tab="punch" aria-pressed="true">Punch List <span id="punchCount">0</span></button><button data-tab="cables" aria-pressed="false">Cable List <span id="cableCount">0</span></button></nav>
<section class="filters"><label>Search<input id="query" type="search" placeholder="Punch no., tag or description…"></label><div class="filter-row"><label>Subsystem<select id="subsystem"><option value="">All subsystems</option></select></label><label id="stateLabel">Status<select id="state"><option value="">All statuses</option><option>Open</option><option>Closed</option><option>Review</option></select></label><label id="categoryLabel">Category<select id="category"><option value="">A / B / C</option><option>A</option><option>B</option><option>C</option></select></label></div><div class="actions"><button id="clear" class="secondary">Clear filters</button><span id="count" role="status"></span></div></section>
<section id="records" aria-label="Results"></section><button id="more" class="secondary" hidden>Show next 50</button></main><dialog id="detail"><header><h2>Details</h2><button id="closeDetail">Close ×</button></header><div id="detailBody"></div></dialog>
<script src="punch-model.js"></script><script src="offline-data.js"></script><script src="mobile.js"></script></body></html>
