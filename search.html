<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hamburg Project — Drawing Finder</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#687086;--border:#dce1eb;--ok:#147a45;--bad:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--text)}
main{max-width:1180px;margin:0 auto;padding:28px 18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 8px 30px rgba(30,45,80,.06)}
h1{margin:0 0 5px;font-size:26px}.subtitle{color:var(--muted);margin:0 0 22px}
.searchbox{font-size:18px;width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:12px;outline:none}
.searchbox:focus{border-color:#9eb0ef;box-shadow:0 0 0 3px #edf1ff}
.status{font-size:13px;color:var(--muted);margin:10px 2px}.ok{color:var(--ok)}.bad{color:var(--bad)}
.wrap{max-height:68vh;overflow:auto;border:1px solid var(--border);border-radius:12px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:#fff;z-index:1}
code,.path{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.path{font-size:11px;word-break:break-word}
.empty{padding:28px;color:var(--muted);text-align:center}
@media(max-width:760px){main{padding:10px}.card{padding:14px}h1{font-size:22px}th:nth-child(4),td:nth-child(4){display:none}table{font-size:12px}}
</style>
</head>
<body>
<main>
<section class="card">
<h1>Hamburg Project</h1>
<p class="subtitle">Drawing Finder</p>

<input id="q" class="searchbox" autofocus autocomplete="off"
       placeholder="Search tag… e.g. 20NDA20CT054 or 20NDA20">

<div id="status" class="status">Type at least 2 characters.</div>

<div class="wrap">
<table>
<thead><tr><th>Tag</th><th>Drawing</th><th>Page / Row</th><th>Pipeline</th><th>Elevation</th></tr></thead>
<tbody id="results"><tr><td colspan="5" class="empty">No search yet.</td></tr></tbody>
</table>
</div>
</section>
</main>

<script>
const API='https://drawing-finder-ocr-api-639231007303.europe-west1.run.app';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let timer=null,lastController=null;

async function search(){
  const q=$('q').value.trim().toUpperCase().replace(/\s+/g,'');
  if(q.length<2){
    $('status').textContent='Type at least 2 characters.';
    $('results').innerHTML='<tr><td colspan="5" class="empty">No search yet.</td></tr>';
    return;
  }

  if(lastController)lastController.abort();
  lastController=new AbortController();

  try{
    $('status').textContent='Searching…';
    const p=new URLSearchParams({q,limit:'150'});
    const r=await fetch(API+'/api/public/search?'+p.toString(),{signal:lastController.signal});
    const j=await r.json();
    if(!r.ok||!j?.ok)throw new Error(j?.error||r.statusText);

    const rows=j.results||[];
    $('status').innerHTML='<span class="ok">'+rows.length+' match(es).</span>';
    $('results').innerHTML=rows.length?rows.map(x=>`<tr>
      <td><code>${esc(x.tag)}</code></td>
      <td><span class="path">${esc(x.drawing_path)}</span></td>
      <td>p.${esc(x.page||1)}${x.row_no!==''&&x.row_no!=null?' / row '+esc(x.row_no):''}</td>
      <td>${x.pipeline?'<code>'+esc(x.pipeline)+'</code>':'—'}</td>
      <td>${esc(x.elevation||'—')}</td>
    </tr>`).join(''):'<tr><td colspan="5" class="empty">No matching tags.</td></tr>';
  }catch(e){
    if(e.name==='AbortError')return;
    $('status').innerHTML='<span class="bad">'+esc(e.message)+'</span>';
  }
}
$('q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(search,180)});
</script>
</body>
</html>
